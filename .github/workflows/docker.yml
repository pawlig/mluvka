name: Docker image → GHCR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/pawlig/mluvka
jobs:
  docker:
    name: Build a kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          build-args: VITE_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: false
          load: true
          tags: mluvka:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ověření HTTP a uživatele
        run: |
          docker run --detach --name mluvka --publish 3000:3000 mluvka:test
          for pokus in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/healthz > health.txt; then break; fi
            sleep 1
          done
          test "$(cat health.txt)" = ok
          curl --fail --silent http://localhost:3000/ | grep -q 'Mluvka'
          test "$(docker exec mluvka id -u)" = 10001
          docker stop mluvka
  publish:
    name: Publikace do GHCR a nasazení
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build z cache (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          build-args: VITE_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: false
          load: true
          tags: mluvka:test
          cache-from: type=gha
      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publikace image
        run: |
          short=$(git rev-parse --short HEAD)
          docker tag mluvka:test "$IMAGE:latest"
          docker tag mluvka:test "$IMAGE:sha-$short"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$short"
      - name: Kontrola Dockerfile pro Easypanel (jen stáhne image)
        run: |
          docker build --pull -t mluvka:easypanel .
          test "$(docker run --rm --entrypoint id mluvka:easypanel -u)" = 10001
      - name: Nasazení na Easypanel (jen když je nastaven secret)
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "EASYPANEL_DEPLOY_WEBHOOK není nastaven — přeskakuji."; exit 0; fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Easypanel nasazení spuštěno."
