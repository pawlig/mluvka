name: Ověření Docker image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    name: Build a kontrola kontejneru
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mluvka:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ověření HTTP a uživatele
        run: |
          docker run --detach --name mluvka --publish 3000:3000 mluvka:test
          for pokus in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/healthz > health.txt; then break; fi
            sleep 1
          done
          test "$(cat health.txt)" = ok
          curl --fail --silent http://localhost:3000/ | grep -q 'Mluvka'
          test "$(docker exec mluvka id -u)" = 10001
          docker stop mluvka
